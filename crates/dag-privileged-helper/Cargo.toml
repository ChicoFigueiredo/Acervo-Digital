[package]
name = "dag-privileged-helper"
description = "Helper mínimo e restrito (dag-helper) que lê só metadados de uma pasta com privilégio, via pkexec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dag_privileged_helper"

[[bin]]
name = "dag-helper"
path = "src/main.rs"

[dependencies]
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
