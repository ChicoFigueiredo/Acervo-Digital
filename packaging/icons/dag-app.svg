<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>DAG — Acervo Digital</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d7a"/>
      <stop offset="1" stop-color="#0e1030"/>
    </linearGradient>
    <linearGradient id="gaveta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gaveta2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gaveta3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fundo)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#brilho)"/>
  <!-- grafo acíclico dirigido: raiz e dois filhos -->
  <g stroke="#fde68a" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M256 120 L170 196"/>
    <path d="M256 120 L342 196"/>
  </g>
  <g fill="#fbbf24" stroke="#0e1030" stroke-width="10">
    <circle cx="256" cy="108" r="34"/>
    <circle cx="164" cy="200" r="28"/>
    <circle cx="348" cy="200" r="28"/>
  </g>
  <!-- gavetas do acervo -->
  <rect x="86" y="262" width="340" height="56" rx="22" fill="url(#gaveta)"/>
  <rect x="86" y="332" width="340" height="56" rx="22" fill="url(#gaveta2)"/>
  <rect x="86" y="402" width="340" height="56" rx="22" fill="url(#gaveta3)"/>
  <g fill="#0e1030" fill-opacity="0.75">
    <circle cx="130" cy="290" r="11"/>
    <circle cx="130" cy="360" r="11"/>
    <circle cx="130" cy="430" r="11"/>
    <rect x="300" y="282" width="94" height="16" rx="8"/>
    <rect x="300" y="352" width="94" height="16" rx="8"/>
    <rect x="300" y="422" width="94" height="16" rx="8"/>
  </g>
